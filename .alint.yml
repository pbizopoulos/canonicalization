version: 1
extends:
  - alint://bundled/hygiene/no-tracked-artifacts@v1
rules:
  - id: root-core-files-policy
    kind: dir_contains
    select: "."
    require:
      - "flake.nix"
      - "formatter.nix"
      - "README"
      - "LICENSE"
    level: error
  - id: root-directories-allowlist
    kind: for_each_dir
    select: "*"
    when_iter: >
      not (

        iter.path == ".codex" or
        iter.path == ".git" or
        iter.path == ".github" or
        iter.path == "checks" or
        iter.path == "hosts" or
        iter.path == "packages" or
        iter.path == "prm" or
        iter.path == "secrets"
      )

    require:
      - kind: dir_absent
        paths: "{path}"
    level: error
  - id: github-workflows-require-workflow-yml
    kind: file_exists
    paths: ".github/workflows/workflow.yml"
    level: error
  - id: github-root-allow-only-workflows
    kind: dir_only_contains
    select: ".github"
    allow:
      - "workflows"
    level: error
  - id: github-workflows-allow-only-workflow-yml
    kind: dir_only_contains
    select: ".github/workflows"
    allow:
      - "workflow.yml"
    level: error
  - id: checks-directories-default-nix-only
    kind: every_matching_has
    select: "checks/*"
    require:
      - kind: file_exists
        paths: "{path}/default.nix"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - "default.nix"
    level: error
  - id: hosts-directories-configuration-nix-only
    kind: every_matching_has
    select: "hosts/*"
    require:
      - kind: file_exists
        paths: "{path}/configuration.nix"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - "configuration.nix"
    level: error
  - id: secrets-files-allowlist
    kind: dir_only_contains
    select: "secrets"
    allow:
      - "secrets.age"
      - "secrets.env.example"
      - "secrets.nix"
    level: error
  - id: packages-require-default-nix
    kind: every_matching_has
    select: "packages/*"
    require:
      - kind: file_exists
        paths: "{path}/default.nix"
    level: error
  - id: packages-django-layout
    kind: every_matching_has
    select: "packages/*/manage.py"
    require:
      - kind: file_exists
        paths: "{dir}/*/__init__.py"
      - kind: file_exists
        paths:
          - "{dir}/*/settings.py"
          - "{dir}/*/urls.py"
          - "{dir}/*/wsgi.py"
      - kind: file_exists
        paths: "{dir}/*/tests/**"
      - kind: file_exists
        paths: "{dir}/templates/**"
      - kind: file_exists
        paths: "{dir}/static/**"
    level: error
  - id: packages-python-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("main.py")'
    require:
      - kind: for_each_dir
        select: "{path}/*"
        when_iter: 'iter.basename != "prm"'
        require:
          - kind: dir_absent
            paths: "{path}"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "main.py"
          - "ms.tex"
          - "ms.bib"
    level: error
  - id: packages-c-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("main.c")'
    require:
      - kind: for_each_dir
        select: "{path}/*"
        when_iter: 'iter.basename != "prm"'
        require:
          - kind: dir_absent
            paths: "{path}"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "main.c"
    level: error
  - id: packages-bash-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("main.sh")'
    require:
      - kind: for_each_dir
        select: "{path}/*"
        when_iter: 'iter.basename != "prm"'
        require:
          - kind: dir_absent
            paths: "{path}"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "main.sh"
    level: error
  - id: packages-haskell-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("Main.hs")'
    require:
      - kind: for_each_dir
        select: "{path}/*"
        when_iter: 'iter.basename != "prm"'
        require:
          - kind: dir_absent
            paths: "{path}"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "Main.hs"
          - "*.cabal"
    level: error
  - id: packages-rust-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths:
          - "{path}/src/main.rs"
          - "{path}/Cargo.lock"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "Cargo.toml"
          - "Cargo.lock"
          - "src"
      - kind: dir_only_contains
        select: "{path}/src"
        allow:
          - "main.rs"
    level: error
  - id: packages-terraform-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("main.tf")'
    require:
      - kind: file_exists
        paths:
          - "{path}/.gitignore"
          - "{path}/.terraform.lock.hcl"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "main.tf"
          - ".terraform"
          - ".terraform.lock.hcl"
    level: error
  - id: packages-html-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("index.html")'
    require:
      - kind: file_exists
        paths:
          - "{path}/script.js"
          - "{path}/style.css"
      - kind: for_each_dir
        select: "{path}/*"
        when_iter: 'iter.basename != "prm"'
        require:
          - kind: dir_absent
            paths: "{path}"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "index.html"
          - "script.js"
          - "style.css"
    level: error
  - id: packages-latex-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("ms.tex")'
    require:
      - kind: file_exists
        paths: "{path}/ms.bib"
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "main.py"
          - "ms.tex"
          - "ms.bib"
    level: error
  - id: packages-django-root-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("manage.py")'
    require:
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
          - "manage.py"
          - "templates"
          - "static"
          - "django_template"
          - "starter"
    level: error
  - id: packages-django-starter-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("manage.py")'
    require:
      - kind: dir_only_contains
        select: "{path}/starter"
        allow:
          - "__init__.py"
          - "admin.py"
          - "apps.py"
          - "auth_backends.py"
          - "context_processors.py"
          - "filters.py"
          - "forms.py"
          - "managers.py"
          - "middleware.py"
          - "models.py"
          - "permissions.py"
          - "serializers.py"
          - "services.py"
          - "signals.py"
          - "tasks.py"
          - "throttle.py"
          - "urls.py"
          - "utils.py"
          - "validators.py"
          - "views.py"
          - "tests"
    level: error
  - id: packages-django-template-shape
    kind: for_each_dir
    select: packages/*
    when_iter: 'iter.has_file("manage.py")'
    require:
      - kind: dir_only_contains
        select: "{path}/django_template"
        allow:
          - "__init__.py"
          - "settings.py"
          - "urls.py"
          - "wsgi.py"
    level: error
  - id: packages-default-shape
    kind: for_each_dir
    select: packages/*
    when_iter: >
      not (

        iter.has_file("main.py") or
        iter.has_file("main.sh") or
        iter.has_file("main.c") or
        iter.has_file("main.tf") or
        iter.has_file("Cargo.toml") or
        iter.has_file("Main.hs") or
        iter.has_file("index.html") or
        iter.has_file("ms.tex") or
        iter.has_file("manage.py")
      )

    require:
      - kind: dir_only_contains
        select: "{path}"
        allow:
          - ".gitignore"
          - "default.nix"
    level: error

[[bin]]
name = "git-home-submodules"
path = "src/main.rs"

[dependencies]

[lints.clippy]
all = {level = "deny", priority = -1}
pedantic = {level = "deny", priority = -1}
nursery = {level = "deny", priority = -1}
cargo = {level = "deny", priority = -1}

[lints.rust]
unsafe_code = "forbid"

[package]
name = "git-home-submodules"
version = "0.1.0"
edition = "2021"
description = "Manage Git submodules in a canonical hierarchy below the home directory."
license = "MIT"
repository = "https://github.com/pbizopoulos/canonicalization"
readme = "../../README"
keywords = ["git", "submodule", "home"]
categories = ["development-tools"]

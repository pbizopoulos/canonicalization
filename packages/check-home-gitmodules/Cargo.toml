[[bin]]
name = "check-home-gitmodules"
path = "src/main.rs"

[dependencies]

[lints.clippy]
all = {level = "deny", priority = -1}
pedantic = {level = "deny", priority = -1}
nursery = {level = "deny", priority = -1}
cargo = {level = "deny", priority = -1}

[lints.rust]
unsafe_code = "forbid"

[package]
name = "check-home-gitmodules"
version = "0.1.0"
edition = "2021"
description = "Check that paths in the home directory's .gitmodules use host/owner/repository layout."
license = "MIT"
repository = "https://github.com/pbizopoulos/canonicalization"
readme = "../../README"
keywords = ["git", "gitmodules", "validation"]
categories = ["development-tools"]
